<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beltworks GPU demo: 1M conveyor items</title>
    <style>html,body{color:#d8dee9;background:#111418;height:100%;margin:0;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}#gpu-canvas{width:100%;height:100%;display:block}#hud{white-space:pre;pointer-events:none;z-index:1;background:#111418cc;border-radius:4px;min-height:9.8em;padding:6px 10px;position:absolute;top:8px;left:8px}#gpu-canvas{touch-action:none;cursor:crosshair}#caption{white-space:nowrap;pointer-events:none;background:#111418d9;border-radius:4px;padding:8px 16px;font:18px/1.4 system-ui,sans-serif;position:absolute;bottom:24px;left:50%;transform:translate(-50%)}#click-mark{box-sizing:border-box;pointer-events:none;border:3px solid #fff;border-radius:6px;position:absolute;box-shadow:0 0 0 3px #0009}#end-card{text-align:center;pointer-events:none;background:#111418e0;flex-direction:column;justify-content:center;align-items:center;gap:10px;font:20px/1.4 system-ui,sans-serif;display:flex;position:absolute;inset:0}#end-card h1{margin:0 0 6px;font-size:34px}#end-card .software{color:#f2d58a;border:2px solid #e5b54a;border-radius:6px;max-width:40em;margin-top:8px;padding:10px 18px}[hidden]{display:none!important}#gpu-message{background:#2b1d1f;border:1px solid #a34e57;border-radius:6px;max-width:32em;padding:16px 20px;font:15px/1.5 system-ui,sans-serif;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}</style>
    <script type="module" crossorigin src="/beltworks-play/assets/gpu-CaEm7pQl.js"></script>
    <link rel="modulepreload" crossorigin href="/beltworks-play/assets/preload-0z9B2t4D.js">
  </head>
  <body>
    <canvas id="gpu-canvas"></canvas>
    <div id="hud">Starting WebGPU...</div>
    <div id="click-mark" hidden></div>
    <div id="caption" hidden></div>
    <div id="end-card" hidden>
      <h1>Beltworks GPU demo</h1>
      <div id="end-items"></div>
      <div>stepped by a WebGPU compute shader, drawn from the same GPU buffers</div>
      <div>adapter: <span id="end-adapter"></span></div>
      <div id="end-software" class="software" hidden></div>
    </div>
    <div id="gpu-message" role="alert" hidden></div>
  </body>
</html>
